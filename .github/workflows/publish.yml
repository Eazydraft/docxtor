name: Publish to GitHub Packages

on:
  release:
    types: [published]

  # Allow manual publish from the Actions tab
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type (patch | minor | major)"
        required: false
        default: patch

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to push the version bump commit/tag
      packages: write # needed to publish to GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so `npm version` can push the tag
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@eazydraft"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      # Only bump the version on manual dispatch; releases already carry a tag
      - name: Bump version (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version_bump }} -m "chore(release): v%s [skip ci]"
          git push --follow-tags

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}