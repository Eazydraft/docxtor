name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    # Trusted publishing: npmjs.com is configured to accept publishes from this
    # repository's publish.yml via GitHub's OIDC token, so no npm token is stored
    # as a secret. Provenance is attested automatically. One-time setup on npm:
    # package settings -> Publishing access -> Trusted publisher -> GitHub Actions,
    # with this repository and the workflow filename "publish.yml".
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that the release tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm check

      # Trusted publishing needs npm 11.5 or newer; Node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
